# HaruLeaf 운영 배포: API 서버 + PostgreSQL.
#   cp .env.prod.example .env && chmod 600 .env && vi .env
#   docker compose -f docker-compose.prod.yml up -d --build
# 개발용 docker-compose.yml(맥북 DB, 5433)과는 프로젝트 이름·볼륨이 따로라 서로 영향이 없다.
name: haruleaf-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB를 .env에 넣어주세요}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER를 .env에 넣어주세요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 넣어주세요}
      TZ: Asia/Seoul
    # 호스트 포트를 열지 않는다. 같은 compose 네트워크의 backend만 db:5432로 접속한다.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: haruleaf-backend:${HARULEAF_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 비밀번호는 URL에 그대로 들어가므로 영문·숫자만 쓴다(openssl rand -hex 32).
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      HOST: 0.0.0.0
      PORT: "4000"
      CORS_ORIGINS: ${HARULEAF_CORS_ORIGINS:-}
      ATTENDANCE_COINS: ${HARULEAF_ATTENDANCE_COINS:-5}
      TZ_NAME: Asia/Seoul
    ports:
      - "${HARULEAF_BACKEND_HOST_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --header 'x-client-platform: web' http://127.0.0.1:4000/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5

volumes:
  pgdata:
